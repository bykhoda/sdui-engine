name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Minimal payload
      description: The smallest JSON payload that reproduces the issue.
      render: json
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS (SwiftUI)
        - Android (Compose)
        - Contract / validator
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: SDK version or commit SHA.
    validations:
      required: true
