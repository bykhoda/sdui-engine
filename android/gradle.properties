# Project-wide Gradle settings.

# Use AndroidX (required by Jetpack Compose).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Give the daemon enough headroom for the Compose compiler.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build features: only the library modules define their own; keep global R class
# namespacing on to avoid resource-id collisions across modules.
android.nonTransitiveRClass=true
